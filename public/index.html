<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0E1116" />
    <meta name="description" content="Flow Space Enterprise — AI Task Manager" />
    
    <!-- iOS метатеги -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flow Space" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Flow Space Enterprise</title>
  </head>
  <body>
    <noscript>Для работы Flow Space требуется включить JavaScript.</noscript>
    <div id="root"></div>

    <!-- Регистрация Service Worker для PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA ServiceWorker зарегистрирован:', reg.scope))
            .catch((err) => console.log('Ошибка регистрации PWA:', err));
        });
      }
    </script>
  </body>
</html>
